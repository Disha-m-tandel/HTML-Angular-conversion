<div class="table-responsive">
  <table class="table align-middle mb-0" id="usersTable" data-searchable-table*>
    <thead>
      <tr>
        <th scope="col">User</th>
        <th scope="col">Role</th>
        <th scope="col">Team</th>
        <th scope="col">Status</th>
        <th scope="col">Joined</th>
        <th scope="col" class="text-end">Action</th>
      </tr>
    </thead>

    <tbody>
      @for (user of users; track user) {
        <tr appRowHighlight>
          <!--The users here comes from: @Input() users: any[] = []; -->
          <td>
            <div class="d-flex align-items-center gap-2">
              <img
                class="avatar-img avatar-sm"
                [src]="user.profile"
                [alt]="user.name"
                />
                <div>
                  <p class="fw-semibold mb-0">
                    {{ user.name | capitalizeName }}
                  </p>
                  <p class="text-muted small mb-0">
                    {{ user.email }}
                  </p>
                </div>
              </div>
            </td>
            <td>{{ user.role }}</td>
            <td>{{ user.team }}</td>
            <td>
              <span
                class="badge"
            [ngClass]="{
              'text-bg-success': user.status === 'active',
              'text-bg-secondary': user.status === 'suspended',
              'text-bg-warning': user.status === 'pending',
            }"
                >
                {{ user.status }}</span
                >
              </td>
              <td>{{ user.joined }}</td>
              <td class="text-end">
                <a class="btn btn-light btn-sm" [routerLink]="['/users', user.id]" appTooltip="View details">
                  View
                </a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
